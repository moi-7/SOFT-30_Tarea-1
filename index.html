<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/login.css">
    <title>Tarea 1</title>
</head>

<body>
    <div class="signin-container">
        <div class="signin-card">
            <h2>Iniciar Sesión</h2>
            <p class="subtitle">Por favor ingresa tus datos para ingresar</p>

            <form class="signin-form">
                <div class="input-group">
                    <label for="email">Correo electrónico o nombre de usuario</label>
                    <input type="email" id="email" placeholder="Ingresa tu correo o usuario" required>
                </div>

                <div class="input-group">
                    <div class="label-wrapper">
                        <label for="password">Contraseña</label>
                        <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
                    </div>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <div class="remember-me">
                    <input type="checkbox" id="remember">
                    <label for="remember">Mantener mi sesión iniciada</label>
                </div>

                <button type="submit" class="submit-btn">Iniciar sesión</button>
            </form>

            <p class="signup-prompt">
                ¿No tienes cuenta? <a href="#" class="signup-link">Regístrate</a>
            </p>
        </div>
    </div>

    <script src="js/index.js"></script>
</body>

</html>
